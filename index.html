<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Adresse de base du site, remplacée par flutter build (--base-href).
    Sur Vercel, le site est à la racine : "/".
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mini Maisons : discute avec tes amis, construis ta maison en 3D et adopte un pet.">
  <meta name="theme-color" content="#F2F2F7">

  <!-- iPhone : « Ajouter à l'écran d'accueil » ouvre le site comme une appli. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mini Maisons">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Mini Maisons</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #F2F2F7;
      overscroll-behavior: none;
    }
    /* Écran d'attente pendant le chargement de l'appli (retiré à la première image). */
    #chargement {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: linear-gradient(#E3EEFF, #F4F1FF 55%, #F2F2F7);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #8A8A8E;
      transition: opacity 0.4s ease;
      z-index: 10;
    }
    #chargement.fini { opacity: 0; pointer-events: none; }
    #chargement .logo {
      width: 88px;
      height: 88px;
      border-radius: 25px;
      background: linear-gradient(135deg, #2F8CFF, #5E5CE6);
      box-shadow: 0 10px 24px rgba(0, 122, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: respire 1.8s ease-in-out infinite;
    }
    #chargement .roue {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top-color: #007AFF;
      animation: tourne 0.8s linear infinite;
    }
    @keyframes tourne { to { transform: rotate(360deg); } }
    @keyframes respire { 50% { transform: scale(1.05); } }
  </style>
</head>
<body>
  <div id="chargement" aria-label="Chargement de Mini Maisons">
    <div class="logo">
      <!-- La petite maison de l'icône. -->
      <svg width="58" height="58" viewBox="14 18 72 68" aria-hidden="true">
        <rect x="63" y="25" width="9" height="17" rx="2.5" fill="#fff"/>
        <path d="M17 50 L50 21 L83 50 Z" fill="#fff" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
        <rect x="26" y="44" width="48" height="36" rx="6" fill="#fff"/>
        <path d="M44 80 V63.5 A6.5 6.5 0 0 1 57 63.5 V80 Z" fill="#4C6EF0"/>
        <rect x="31" y="54" width="9" height="9" rx="2" fill="#4C6EF0"/>
        <path d="M50 41 C44 37 45 31.5 48 31.5 C49.2 31.5 50 32.5 50 33.5 C50 32.5 50.8 31.5 52 31.5 C55 31.5 56 37 50 41 Z" fill="#FF6B8B"/>
      </svg>
    </div>
    <div class="roue"></div>
  </div>
  <script>
    // L'appli est prête : l'écran d'attente s'efface.
    window.addEventListener('flutter-first-frame', function () {
      var ecran = document.getElementById('chargement');
      if (!ecran) return;
      ecran.classList.add('fini');
      setTimeout(function () { ecran.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
